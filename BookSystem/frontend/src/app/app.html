<div class="hero-bg"></div>
<div class="content">
  <h1>Den Sorte Boghandel</h1>
</div>

<div class="box-container">

  <!-- Handlinger-boksen -->
  <div class="box">
    Handlinger

    <div class="action-box">
      <button class="action-button">Tilføj bog</button>
      <button class="action-button">Slet bog</button>
      <button class="action-button">Opdater bog</button>
      <button class="action-button">Information om bog</button>
    </div>
  </div>

  <!-- De andre bokse -->
  <div class="box">Søge i database</div>
  <div class="box">
    
    Information

  <div class="subtext">Hvor er bogen solgt:</div>

<div class="action-box info-row">
  <label class="check-item">
    <input type="checkbox">
    <span class="circle"></span>
    Den blå avis
  </label>

  <label class="check-item">
    <input type="checkbox">
    <span class="circle"></span>
    Vinted
  </label>
</div>

<div class="subtext">Hvordan er bogen afhentet:</div>

  <div class="action-box info-row">
    <label class="check-item">
      <input type="checkbox">
      <span class="circle"></span>
      Hent
    </label>

    <label class="check-item">
      <input type="checkbox">
      <span class="circle"></span>
      Sendt
    </label>
</div>

<div class="subtext">Er bogen solgt med andre bøger:</div>

  <div class="action-box info-row">
    <label class="check-item">
      <input type="radio" name="soldWithOthers"id="soldWithOthersYes" (click)="soldWithOthers = true; updateOtherBooks()">
      <span class="circle"></span>
      Ja
    </label>

    <label class="check-item">
      <input type="radio" name="soldWithOthers" id="soldWithOthersNo" (click)="soldWithOthers = false;">
      <span class="circle"></span>
      Nej
    </label>
</div>
  <!-- Bøger solgt med -->

<div *ngIf="soldWithOthers" style="margin-top: 10px;">
  <label>Hvilke bøger:</label>
  <input type="number"
          min="1"
          [(ngModel)]="amount"
          (ngModelChange)="updateOtherBooks()"
          style="width:60px;">
</div>

<div *ngIf="soldWithOthers && amount > 0" style="margin-top:10px;">
  <div *ngFor="let book of otherBooks; let i = index" style="margin-top: 12px;">

    <label>Bog {{ i + 1 }}:</label>
    <input type="text" [(ngModel)]="otherBooks[i]" style="width: 100%;">

    <label style="margin-top: 6px; display:block;">Information:</label>
    <textarea rows="3" style="width: 100%;"></textarea>

  </div>
</div>

</div>
